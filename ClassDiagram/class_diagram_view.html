    .viewer-container { flex: 1; width: 100%; height: calc(100vh - 60px); position: relative; background: #ffffff; overflow: hidden; cursor: grab; user-select: none; }
    .viewer-container:active { cursor: grabbing; }

    <div class="hud-scale" id="scaleIndicator">Zoom: 100%</div>
  </div>
  <script>
    const svg = document.getElementById('main-svg');
    const container = document.getElementById('container');
    const scaleIndicator = document.getElementById('scaleIndicator');
    let vb = { x: 0, y: 0, w: 3600, h: 2500 };
    const defaultVb = { x: 0, y: 0, w: 3600, h: 2500 };
    const layers = {
      all: { x: 0, y: 0, w: 3600, h: 2500 },
      model: { x: 20, y: 80, w: 1400, h: 1270 },
      repo: { x: 1440, y: 80, w: 2130, h: 1270 },
      ctrl: { x: 20, y: 1360, w: 1970, h: 1110 },
      ex: { x: 2000, y: 1360, w: 770, h: 1110 },
      view: { x: 2780, y: 1360, w: 790, h: 1110 }
    };
    function updateViewBox() {
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      const zoom = Math.round((3600 / vb.w) * 100);
      scaleIndicator.innerText = `Zoom: ${zoom}%`;
    }
    function fitScreen() { jumpTo('all'); }
    function jumpTo(layerKey) {
      const target = layers[layerKey];
      if (!target) return;
      document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('btn-' + layerKey);
      if (btn) btn.classList.add('active');
      animateViewBox(target);
    }
    function animateViewBox(tgt) {
      const start = { ...vb };
      const startTime = performance.now();
      const duration = 250;
      function step(now) {
        const p = Math.min((now - startTime) / duration, 1);
        const ease = 0.5 - Math.cos(p * Math.PI) / 2;
        vb.x = start.x + (tgt.x - start.x) * ease;
        vb.y = start.y + (tgt.y - start.y) * ease;
        vb.w = start.w + (tgt.w - start.w) * ease;
        vb.h = start.h + (tgt.h - start.h) * ease;
        updateViewBox();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    function zoomDelta(factor) {
      const cx = vb.x + vb.w / 2;
      const cy = vb.y + vb.h / 2;
      vb.w *= factor;
      vb.h *= factor;
      vb.x = cx - vb.w / 2;
      vb.y = cy - vb.h / 2;
      updateViewBox();
    }
    let isDragging = false, startX = 0, startY = 0;
    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = container.getBoundingClientRect();
      const dx = (e.clientX - startX) * (vb.w / rect.width);
      const dy = (e.clientY - startY) * (vb.h / rect.height);
      vb.x -= dx;
      vb.y -= dy;
      startX = e.clientX;
      startY = e.clientY;
      updateViewBox();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 0.85 : 1.15;
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const svgX = vb.x + (mouseX / rect.width) * vb.w;
      const svgY = vb.y + (mouseY / rect.height) * vb.h;
      vb.w *= factor;
      vb.h *= factor;
      vb.x = svgX - (mouseX / rect.width) * vb.w;
      vb.y = svgY - (mouseY / rect.height) * vb.h;
      updateViewBox();
    }, { passive: false });
    container.addEventListener('dblclick', () => { jumpTo('all'); });
    function searchClass(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('.class-node').forEach(node => {
        node.classList.remove('highlighted');
      });
      if (!q) return;
      let firstMatch = null;
      document.querySelectorAll('.class-node').forEach(node => {
        const id = node.getAttribute('data-id').toLowerCase();
        if (id.includes(q)) {
          node.classList.add('highlighted');
          if (!firstMatch) firstMatch = node;
        }
      });
      if (firstMatch) {
        const cx = parseFloat(firstMatch.getAttribute('data-cx'));
        const cy = parseFloat(firstMatch.getAttribute('data-cy'));
        const w = 700, h = 500;
        animateViewBox({ x: cx - w/2, y: cy - h/2, w: w, h: h });
      }
    }
    updateViewBox();
  </script>
