<?xml version="1.0" encoding="UTF-8"?>
<svg id="main-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 2500" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #ffffff; }
      .pkg-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; stroke-dasharray: 6,4; rx: 8; }
      .pkg-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; }
      .class-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .head-title { fill: #000000; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .head-sub { fill: #4b5563; font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .txt-attr { fill: #111827; font-family: 'Consolas', 'Courier New', monospace; font-size: 10.5px; }
      .txt-meth { fill: #111827; font-family: 'Consolas', 'Courier New', monospace; font-size: 10.5px; }
      .sep { stroke: #000000; stroke-width: 1; }
      .edge-inherit { fill: none; stroke: #000000; stroke-width: 1.6; }
      .edge-realize { fill: none; stroke: #000000; stroke-width: 1.6; stroke-dasharray: 5,4; }
      .edge-assoc { fill: none; stroke: #1f2937; stroke-width: 1.4; }
      .edge-aggr { fill: none; stroke: #000000; stroke-width: 1.5; }
      .edge-depend { fill: none; stroke: #374151; stroke-width: 1.4; stroke-dasharray: 4,4; }
      .edge-label { fill: #111827; font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-style: italic; text-anchor: middle; }
      .title-main { fill: #000000; font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: bold; text-anchor: middle; }
      .title-sub { fill: #4b5563; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    </style>
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <polygon points="1 1, 11 6, 1 11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="uml-assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="uml-diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="12" markerHeight="8" orient="auto">
      <polygon points="1 5, 8 1, 15 5, 8 9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="3600" height="2500" class="canvas-bg" />
  <g class="class-node" id="node-Main" data-id="Main" data-cx="2910" data-cy="1500" transform="translate(2800, 1460)">
    <rect x="0" y="0" width="220" height="80" class="class-box" />
    <text x="110" y="20" class="head-title">Main</text>
    <text x="110" y="32" class="head-sub">Application Entrypoint</text>
    <line x1="0" y1="38" x2="220" y2="38" class="sep" />
    <line x1="0" y1="52" x2="220" y2="52" class="sep" />
    <text x="8" y="67" class="txt-meth">+ main(args: String[]): void (static)</text>
  </g>
  <g class="class-node" id="node-IView" data-id="IView" data-cx="3150" data-cy="1500" transform="translate(3050, 1460)">
    <rect x="0" y="0" width="200" height="80" class="class-box" />
    <text x="100" y="20" class="head-title">IView</text>
    <text x="100" y="32" class="head-sub">&lt;&lt;interface&gt;&gt;</text>
    <line x1="0" y1="38" x2="200" y2="38" class="sep" />
    <line x1="0" y1="52" x2="200" y2="52" class="sep" />
    <text x="8" y="67" class="txt-meth">+ display(): void</text>
  </g>
  <g class="class-node" id="node-MainView" data-id="MainView" data-cx="3025" data-cy="1680" transform="translate(2800, 1560)">
    <rect x="0" y="0" width="450" height="240" class="class-box" />
    <text x="225" y="20" class="head-title">MainView</text>
    <text x="225" y="32" class="head-sub">implements IView</text>
    <line x1="0" y1="38" x2="450" y2="38" class="sep" />
    <text x="8" y="52" class="txt-attr">- mainController: MainController</text>
    <text x="8" y="67" class="txt-attr">- customerController, restaurantController, driverController, orderController, simulatorController, authController, adminController</text>
    <text x="8" y="82" class="txt-attr">- mapView: MapView, simulatorView: SimulatorView, orderView: OrderView, reportView: ReportView</text>
    <line x1="0" y1="97" x2="450" y2="97" class="sep" />
    <text x="8" y="112" class="txt-meth">+ display(): void</text>
    <text x="8" y="127" class="txt-meth">- displayLoginScreen(): boolean</text>
    <text x="8" y="142" class="txt-meth">- handleCustomerMenu() / handleDriverMenu()</text>
    <text x="8" y="157" class="txt-meth">- handleRestaurantMenu() / handleAdminMenu()</text>
    <text x="8" y="172" class="txt-meth">- checkAndDisplayCustomerNotifications(custId): void</text>
    <text x="8" y="187" class="txt-meth">- handleCustomerPlaceOrderFlow(custId): void</text>
  </g>
  <g class="class-node" id="node-MapView" data-id="MapView" data-cx="2925" data-cy="1880" transform="translate(2800, 1830)">
    <rect x="0" y="0" width="250" height="100" class="class-box" />
    <text x="125" y="20" class="head-title">MapView</text>
    <text x="125" y="32" class="head-sub">ASCII Grid Map Visualizer</text>
    <line x1="0" y1="38" x2="250" y2="38" class="sep" />
    <text x="8" y="52" class="txt-attr">- rows, cols: int</text>
    <text x="8" y="67" class="txt-attr">- minLat, maxLat, minLon, maxLon: double</text>
    <line x1="0" y1="82" x2="250" y2="82" class="sep" />
    <text x="8" y="97" class="txt-meth">+ renderAsciiMap(restaurants, customers, drivers, orders): void</text>
  </g>
  <g class="class-node" id="node-OrderView" data-id="OrderView" data-cx="3205" data-cy="1880" transform="translate(3080, 1830)">
    <rect x="0" y="0" width="250" height="100" class="class-box" />
    <text x="125" y="20" class="head-title">OrderView</text>
    <text x="125" y="32" class="head-sub">Orders &amp; Menus Output</text>
    <line x1="0" y1="38" x2="250" y2="38" class="sep" />
    <line x1="0" y1="52" x2="250" y2="52" class="sep" />
    <text x="8" y="67" class="txt-meth">+ renderOrders(orders: List&lt;Order&gt;): void</text>
    <text x="8" y="82" class="txt-meth">+ displayMenu(restaurant, items): void</text>
  </g>
  <g class="class-node" id="node-ReportView" data-id="ReportView" data-cx="2925" data-cy="2000" transform="translate(2800, 1950)">
    <rect x="0" y="0" width="250" height="100" class="class-box" />
    <text x="125" y="20" class="head-title">ReportView</text>
    <text x="125" y="32" class="head-sub">Benchmark Summary</text>
    <line x1="0" y1="38" x2="250" y2="38" class="sep" />
    <line x1="0" y1="52" x2="250" y2="52" class="sep" />
    <text x="8" y="67" class="txt-meth">+ printResearchConclusion(runs): void</text>
    <text x="8" y="82" class="txt-meth">+ renderSimulationSummary(run): void</text>
  </g>
  <g class="class-node" id="node-SimulatorView" data-id="SimulatorView" data-cx="3205" data-cy="2000" transform="translate(3080, 1950)">
    <rect x="0" y="0" width="250" height="100" class="class-box" />
    <text x="125" y="20" class="head-title">SimulatorView</text>
    <text x="125" y="32" class="head-sub">Benchmark Comparison Table</text>
    <line x1="0" y1="38" x2="250" y2="38" class="sep" />
    <line x1="0" y1="52" x2="250" y2="52" class="sep" />
    <text x="8" y="67" class="txt-meth">+ printBenchmarkTable(runs): void</text>
    <text x="8" y="82" class="txt-meth">+ renderComparisonTable(runs): void</text>
  </g>
  <path d="M 3025 1560 L 3150 1540" class="edge-realize" marker-end="url(#uml-inherit)" />
  <path d="M 3025 1800 L 2925 1830" class="edge-aggr" marker-start="url(#uml-diamond)" />
  <path d="M 3025 1800 L 3205 1830" class="edge-aggr" marker-start="url(#uml-diamond)" />
  <path d="M 3025 1800 L 2925 1950" class="edge-aggr" marker-start="url(#uml-diamond)" />
  <path d="M 3025 1800 L 3205 1950" class="edge-aggr" marker-start="url(#uml-diamond)" />
</svg>
