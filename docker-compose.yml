# ==============================================================================
# FOOD DELIVERY NETWORK SIMULATION (FDS) - DOCKER COMPOSE CONFIGURATION
# One-click startup for Fullstack Web Application with Persistent CSV Volumes
# ==============================================================================

version: '3.8'

services:
  food-delivery-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fds-fullstack-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Xms128m -Xmx512m
    volumes:
      # Mount CSV data directory for transactional persistence across container restarts
      - ./data:/app/data
      # Mount web assets for hot reloading during frontend customization
      - ./web:/app/web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - fds-network

networks:
  fds-network:
    driver: bridge
