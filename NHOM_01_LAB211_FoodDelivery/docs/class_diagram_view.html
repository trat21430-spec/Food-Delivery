  <script>
    let scale = 0.55;
    const wrap = document.getElementById('svg-wrap');
    const txt = document.getElementById('zoom-text');
    function apply() {
      wrap.style.transform = 'scale(' + scale + ')';
      txt.innerText = 'Tỉ lệ: ' + Math.round(scale * 100) + '%';
    }
    function zoomIn() { scale += 0.1; apply(); }
    function zoomOut() { if (scale > 0.2) scale -= 0.1; apply(); }
    function resetZoom() { scale = 0.55; apply(); }
    apply();
  </script>
