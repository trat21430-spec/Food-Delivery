<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" width="1300" height="950">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.8; rx: 10; }
      .header-title { fill: #38bdf8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .header-sub { fill: #94a3b8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; text-anchor: middle; }

      .m-badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .m-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #f8fafc; }
      .m-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }

      .week-box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .week-box-cp { fill: #451a03; stroke: #f97316; stroke-width: 2; rx: 6; }
      .week-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #38bdf8; }
      .week-num-cp { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #fb923c; }
      .week-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .week-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
      .week-assign { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #38bdf8; }

      .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1300" height="950" class="bg"/>

  <!-- Main Header -->
  <text x="650" y="45" class="header-title">PHÂN CÔNG NHÓM 6 THÀNH VIÊN &amp; LỊCH TRÌNH 10 TUẦN</text>
  <text x="650" y="70" class="header-sub">Food Delivery Network Simulation (LAB211 - FPT University)</text>

  <!-- ================= LEFT COLUMN: 6 MEMBERS ROLES ================= -->
  <text x="30" y="110" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#38bdf8">👥 PHÂN CÔNG VAI TRÒ 6 THÀNH VIÊN</text>

  <!-- Member 1 -->
  <g transform="translate(30, 130)">
    <rect width="360" height="115" class="card"/>
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#0284c7"/>
