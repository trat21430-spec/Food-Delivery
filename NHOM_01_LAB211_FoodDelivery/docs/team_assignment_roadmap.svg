    <text x="55" y="36" class="week-num" text-anchor="middle">Tuần 9</text>
    <text x="110" y="30" class="week-title">Chạy Thực Nghiệm Full &amp; Viết Báo Cáo Nghiên Cứu (Report &amp; Slide)</text>
