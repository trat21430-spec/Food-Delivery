  <!-- Tuần 1-2 -->
  <g transform="translate(430, 130)">
    <rect width="840" height="65" class="card"/>
    <rect x="15" y="12" width="80" height="40" class="week-box"/>
    <text x="55" y="36" class="week-num" text-anchor="middle">Tuần 1–2</text>
