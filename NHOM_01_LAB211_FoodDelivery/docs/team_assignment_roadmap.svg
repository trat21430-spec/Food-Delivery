    <text x="110" y="30" class="week-title" fill="#fb923c">CHECKPOINT 2: Simulator Tool (CountDownLatch 1.000 Đơn) &amp; Hậu Kiểm CSV</text>
    <text x="110" y="48" class="week-text">Lập trình SimulatorController đa luồng; Viết 3 hàm quét hậu kiểm CSV; Render Bảng so sánh 8 cột trên CLI &amp; Web</text>
    <text x="760" y="38" class="week-assign" fill="#fb923c" text-anchor="end">M4, M2, M3, M5 (Checkpoint)</text>
