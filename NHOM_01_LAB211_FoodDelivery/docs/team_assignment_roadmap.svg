    <text x="15" y="76" class="m-desc">• Hậu kiểm trực tiếp CSV (detectDoubleAssign...)</text>
    <text x="15" y="94" class="m-desc">• Đo đạc Throughput ops/sec &amp; % Drop</text>
  </g>

