    <text x="105" y="31" class="m-title">MVC View &amp; Web Dashboard</text>
    <text x="15" y="58" class="m-desc">• CLI MainView, MapView (ASCII Grid 2D), SimulatorView</text>
    <text x="15" y="76" class="m-desc">• Embedded WebServer.java (HttpServer backend 8080)</text>
    <text x="15" y="94" class="m-desc">• Web Dashboard Frontend (HTML5/Canvas/Chart.js)</text>
  </g>

