    <text x="105" y="31" class="m-title">Leader / Core Architect</text>
    <text x="15" y="58" class="m-desc">• Kiến trúc MVC, BaseEntity, GeoUtils (Haversine)</text>
    <text x="15" y="76" class="m-desc">• Generic CsvRepository, Code Review &amp; Integration</text>
    <text x="15" y="94" class="m-desc">• Khảo sát Race Condition &amp; Quản lý nộp ZIP</text>
  </g>

  <!-- Member 2 -->
  <g transform="translate(30, 260)">
    <rect width="360" height="115" class="card"/>
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#16a34a"/>
    <text x="55" y="31" class="m-badge" text-anchor="middle">Member 2</text>
    <text x="105" y="31" class="m-title">Data Engine &amp; MenuItem Repo</text>
    <text x="15" y="58" class="m-desc">• DataGenerator.java (sinh 18.700 dòng CSV)</text>
    <text x="15" y="76" class="m-desc">• MenuItemRepository (Trừ kho &amp; Khóa 4 cơ chế)</text>
    <text x="15" y="94" class="m-desc">• CustomerRepository, RestaurantRepository</text>
  </g>

  <!-- Member 3 -->
