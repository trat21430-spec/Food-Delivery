    <rect x="15" y="15" width="80" height="24" rx="4" fill="#9333ea"/>
    <text x="55" y="31" class="m-badge" text-anchor="middle">Member 3</text>
    <text x="105" y="31" class="m-title">Concurrency &amp; Driver Dispatch</text>
    <text x="15" y="58" class="m-desc">• DriverRepository (Haversine nearest &amp; mark busy)</text>
    <text x="15" y="76" class="m-desc">• OrderRepository (Gán tài xế &amp; Khóa 4 cơ chế)</text>
    <text x="15" y="94" class="m-desc">• Custom Exceptions (Oversell, DoubleAssign, etc.)</text>
